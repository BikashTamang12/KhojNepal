<section class="page-container py-8 sm:py-10">
  <app-page-header
    eyebrow="Public Directory"
    title="Browse Lost & Found Items"
    description="Search reported belongings across all provinces of Nepal and inspect details to submit verified ownership claims."
  >
    <div page-actions class="flex flex-wrap gap-2.5">
      @if (authService.isAdmin()) {
        <a
          routerLink="/admin/items"
          class="inline-flex items-center gap-1.5 min-h-[42px] px-4 rounded-lg bg-[var(--color-primary)] text-[var(--color-primary-foreground)] font-semibold"
        >
          <app-icon name="shield" sizeClass="w-4 h-4" />
          <span>Moderate Items</span>
        </a>
      } @else {
        <a
          routerLink="/items/report-lost"
          class="inline-flex items-center gap-1.5 min-h-[42px] px-4 rounded-lg bg-[var(--color-primary)] text-[var(--color-primary-foreground)] font-semibold"
        >
          <app-icon name="plus" sizeClass="w-4 h-4" />
          <span>Report Lost</span>
        </a>
        <a
          routerLink="/items/report-found"
          class="inline-flex items-center gap-1.5 min-h-[42px] px-4 rounded-lg border border-[var(--color-border)] font-semibold hover:bg-[var(--color-hover)]"
        >
          <span>Report Found</span>
        </a>
      }
    </div>
  </app-page-header>

  <form
    class="surface-card-padded mb-6"
    (ngSubmit)="applyFilters()"
    aria-label="Filter items"
  >
    <div class="filter-grid">
      <div class="field-group filter-search-wide">
        <label class="field-label" for="browse-q">Search Keyword</label>
        <input
          id="browse-q"
          name="q"
          type="search"
          class="form-control"
          placeholder="Search title, brand, color, area..."
          [(ngModel)]="q"
        />
      </div>

      <div class="field-group">
        <label class="field-label" for="browse-type">Report Type</label>
        <select
          id="browse-type"
          name="reportType"
          class="form-select"
          [(ngModel)]="reportType"
          (change)="applyFilters()"
        >
          <option value="">All Types</option>
          <option value="LOST">Lost Items</option>
          <option value="FOUND">Found Items</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="browse-status">Status</label>
        <select
          id="browse-status"
          name="status"
          class="form-select"
          [(ngModel)]="status"
          (change)="applyFilters()"
        >
          <option value="">Any Status</option>
          <option value="OPEN">Open</option>
          <option value="CLAIM_PENDING">Claim Pending</option>
          <option value="RESOLVED">Resolved</option>
          <option value="CLOSED">Closed</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="browse-category">Category</label>
        <select
          id="browse-category"
          name="categoryId"
          class="form-select"
          [(ngModel)]="categoryId"
          (change)="applyFilters()"
        >
          <option value="">All Categories</option>
          @for (cat of categories(); track cat.id) {
            <option [value]="cat.id">{{ cat.name }}</option>
          }
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="browse-province">Province</label>
        <select
          id="browse-province"
          name="province"
          class="form-select"
          [(ngModel)]="province"
          (change)="onProvinceChanged()"
        >
          <option value="">All Provinces</option>
          @for (prov of provinces(); track prov) {
            <option [value]="prov">{{ prov }}</option>
          }
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="browse-district">District</label>
        <select
          id="browse-district"
          name="district"
          class="form-select"
          [(ngModel)]="district"
          (change)="applyFilters()"
        >
          <option value="">All Districts</option>
          @for (dist of districts(); track dist) {
            <option [value]="dist">{{ dist }}</option>
          }
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="browse-sort">Sort Order</label>
        <select
          id="browse-sort"
          name="sortBy"
          class="form-select"
          [(ngModel)]="sortBy"
          (change)="applyFilters()"
        >
          <option value="newest">Newest Reported</option>
          <option value="oldest">Oldest First</option>
          <option value="dateLostOrFound">Incident Date (Recent)</option>
        </select>
      </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-3 mt-4 pt-4 border-t border-[var(--color-border)]">
      <span class="text-sm text-secondary">
        Showing {{ items().length }} of {{ totalItems() }} reports
      </span>

      <div class="flex flex-wrap gap-2.5">
        <app-button type="button" variant="outline" size="sm" (click)="resetFilters()">
          Reset Filters
        </app-button>
        <app-button type="submit" variant="primary" size="sm">
          Apply Search
        </app-button>
      </div>
    </div>
  </form>

  @if (loading()) {
    <app-loading mode="skeleton" skeletonVariant="card" [count]="6" />
  } @else if (error()) {
    <app-error-state
      title="Could not load items"
      [message]="error()!"
      (retry)="fetchItems()"
    />
  } @else if (items().length === 0) {
    <app-empty-state
      icon="search"
      title="No matching items found"
      description="Try clearing a filter or broaden your search keywords to see more reports."
      actionLabel="Clear Filters"
      (actionClick)="resetFilters()"
    />
  } @else {
    <div class="responsive-grid-3">
      @for (item of items(); track item.id) {
        <app-item-card
          [id]="item.id"
          [title]="item.title"
          [description]="item.description"
          [imageUrl]="getImageUrl(item)"
          [category]="item.category?.name || 'General'"
          [location]="getLocationText(item)"
          [date]="getDateText(item)"
          [status]="item.reportType === 'FOUND' ? 'found' : 'lost'"
        />
      }
    </div>

    <div class="mt-8">
      <app-pagination
        [page]="page"
        [pageSize]="limit"
        [totalItems]="totalItems()"
        [showPageSizeSelector]="true"
        [pageSizeOptions]="[9, 18, 36]"
        itemLabel="reports"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
      />
    </div>
  }
</section>
