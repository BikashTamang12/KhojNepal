<app-page-header
  eyebrow="Lost Item Report"
  title="Report a Lost Item"
  description="Provide accurate item attributes, location, and photos so KhojNepal can match it against found reports."
>
  <a
    page-actions
    routerLink="/items/my"
    class="inline-flex items-center gap-2 min-h-[42px] px-4 rounded-lg border border-[var(--color-border)] font-semibold hover:bg-[var(--color-hover)]"
  >
    <app-icon name="arrow-left" sizeClass="w-4 h-4" />
    <span>Back to My Reports</span>
  </a>
</app-page-header>

<app-item-report-form
  reportType="LOST"
  [submitting]="submitting()"
  [serverError]="serverError()"
  (submitted)="handleSubmit($event)"
/>
