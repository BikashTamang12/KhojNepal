<div class="input-field">
  @if (label) {
    <label class="input-label" [for]="controlId">
      {{ label }}

      @if (required) {
        <span class="required-mark">*</span>
      }
    </label>
  }

  <input
    class="form-input"
    [id]="controlId"
    [name]="name || controlId"
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [required]="required"
    [disabled]="disabled"
    [attr.autocomplete]="autocomplete || null"
    [attr.min]="min || null"
    [attr.max]="max || null"
    [attr.aria-invalid]="error ? 'true' : null"
    [attr.aria-describedby]="error ? controlId + '-error' : hint ? controlId + '-hint' : null"
    (input)="onInputChange($event)"
    (blur)="onInputBlur()"
  />

  @if (error) {
    <p class="input-error" [id]="controlId + '-error'">
      {{ error }}
    </p>
  } @else if (hint) {
    <p class="input-hint" [id]="controlId + '-hint'">
      {{ hint }}
    </p>
  }
</div>
