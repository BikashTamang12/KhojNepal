
<a
  [routerLink]="route"
  class="logo"
  [class.logo-sm]="size === 'sm'"
  [class.logo-lg]="size === 'lg'"
>
  <svg
    class="logo-mark"
    viewBox="0 0 48 48"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <!-- Nepal-inspired mountain and location mark -->
    <path
      d="M5 36L17 15L24 25L31 10L43 36H5Z"
      fill="#142D4E"
    />
    <path
      d="M17 15L21 21L17 20L14 23L17 15Z"
      fill="#FFFFFF"
    />
    <path
      d="M31 10L35 21L31 18L27 22L31 10Z"
      fill="#FFFFFF"
    />
    <path
      d="M24 25L31 10L43 36H24"
      fill="#0F9D8A"
    />
    <path
      d="M24 25L31 10L35 21L31 18L27 22L24 25Z"
      fill="#FFFFFF"
    />
    <circle cx="31" cy="29" r="7" fill="#C83D4D" />
    <circle cx="31" cy="29" r="2.5" fill="#FFFFFF" />
  </svg>

  @if (showText) {
    <span class="logo-name">
      Khoj<span class="logo-accent">Nepal</span>
    </span>
  }
</a>
