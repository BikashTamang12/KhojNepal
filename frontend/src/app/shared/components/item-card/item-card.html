<article class="item-card">
  <div class="item-media">
    @if (imageUrl) {
      <img
        class="item-image"
        [src]="imageUrl"
        [alt]="title"
        loading="lazy"
      />
    } @else {
      <div class="image-placeholder flex-col gap-2">
        <app-icon name="photo" sizeClass="w-9 h-9 opacity-75" />
        <span class="text-xs font-medium">No image available</span>
      </div>
    }

    <a
      class="item-image-link"
      [routerLink]="['/items', id]"
      [attr.aria-label]="'View ' + title"
    ></a>

    <app-badge
      class="item-status"
      [variant]="status"
      [label]="status === 'lost' ? 'Lost Item' : 'Found Item'"
    />
  </div>

  <div class="item-content">
    <span class="item-category">{{ category }}</span>

    <h2 class="item-title">
      <a [routerLink]="['/items', id]">{{ title }}</a>
    </h2>

    <p class="item-description">{{ description }}</p>

    <div class="item-meta">
      @if (location) {
        <span class="inline-flex items-center gap-1.5">
          <app-icon name="map-pin" sizeClass="w-3.5 h-3.5 text-brand-crimson" />
          {{ location }}
        </span>
      }

      @if (date) {
        <span class="inline-flex items-center gap-1.5">
          <app-icon name="calendar" sizeClass="w-3.5 h-3.5 text-brand-teal" />
          {{ date }}
        </span>
      }
    </div>

    <a class="item-link group" [routerLink]="['/items', id]">
      <span>View Details</span>
      <app-icon
        name="arrow-right"
        sizeClass="w-4 h-4 transition-transform duration-200 group-hover:translate-x-1"
      />
    </a>
  </div>
</article>
